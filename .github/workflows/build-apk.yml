name: Build DevDrop Android APK & Web

on:
  push:
    branches: [ main ]
    tags:
      - 'v*'
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-web-and-extension:
    name: Build Web Dashboard & Extension
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies & compile packages
        run: |
          npm install
          npm run build

      - name: Typecheck Workspaces
        run: |
          npx tsc --project apps/web/tsconfig.json --noEmit
          npx tsc --project apps/extension/tsconfig.json --noEmit
          npx tsc --project apps/android/tsconfig.json --noEmit

      - name: Build Web App
        run: npm run build --workspace=apps/web

      - name: Build Chrome Extension
        run: npm run build --workspace=apps/extension

  build-android-apk:
    name: Build Android APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies & compile packages
        run: |
          npm install
          npm run build

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: 17

      - name: Setup Android SDK & NDK
        run: |
          mkdir -p "$ANDROID_HOME/licenses" || true
          echo "24333f8a63b6825ea9c5514f83c2829b004d1fee" >> "$ANDROID_HOME/licenses/android-sdk-license" || true
          echo "84831b9409646a918e30573bab4c9c91346d8abd" >> "$ANDROID_HOME/licenses/android-sdk-preview-license" || true
          echo "d56f5187479451eabf01fb78af6dfcb131a6481e" >> "$ANDROID_HOME/licenses/android-sdk-license" || true
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "platforms;android-35" "build-tools;35.0.0" "ndk;27.1.12297006" || true

      - name: Configure local.properties
        run: |
          echo "sdk.dir=$ANDROID_HOME" > apps/android/android/local.properties
          echo "ndk.dir=$ANDROID_HOME/ndk/27.1.12297006" >> apps/android/android/local.properties
          cat apps/android/android/local.properties

      - name: Make Gradlew Executable
        run: chmod +x apps/android/android/gradlew

      - name: Build Release APK
        working-directory: apps/android/android
        env:
          ANDROID_HOME: /usr/local/lib/android/sdk
          ANDROID_NDK_HOME: /usr/local/lib/android/sdk/ndk/27.1.12297006
        run: |
          ./gradlew assembleRelease --no-daemon --stacktrace

      - name: Locate and Package APK
        run: |
          echo "=== Locating Built APKs ==="
          ls -la apps/android/android/app/build/outputs/apk/release/ || true
          find apps/android/android -name "*.apk"
          mkdir -p dist/apk
          APK_FILE=$(find apps/android/android -name "*.apk" | grep -E "release|app" | head -n 1)
          if [ -z "$APK_FILE" ]; then
            APK_FILE=$(find apps/android/android -name "*.apk" | head -n 1)
          fi
          if [ -z "$APK_FILE" ]; then
            echo "ERROR: No APK generated by Gradle build!"
            exit 1
          fi
          echo "Selecting APK: $APK_FILE"
          cp "$APK_FILE" dist/apk/devdrop.apk
          ls -lh dist/apk/

      - name: Upload Release APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: devdrop-release-apk
          path: dist/apk/devdrop.apk
          if-no-files-found: error
          retention-days: 30

      - name: Create Release & Upload APK
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/apk/devdrop.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
